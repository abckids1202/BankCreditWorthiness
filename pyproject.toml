[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-credit-simulator"
version = "0.1.0"
description = "Educational, explainable credit-risk decision simulator"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "pyyaml>=6,<7",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "streamlit>=1.35,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["credit_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
