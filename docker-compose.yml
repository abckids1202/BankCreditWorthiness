services:
  api:
    build: .
    command: uvicorn credit_simulator.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs

