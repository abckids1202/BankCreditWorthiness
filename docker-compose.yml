services:
  api:
    build: .
    command: uvicorn credit_simulator.api:app --host 0.0.0.0 --port 8000
    environment:
      CREDIT_API_KEY: "${CREDIT_API_KEY:-}"
      CREDIT_RATE_LIMIT_PER_MINUTE: "${CREDIT_RATE_LIMIT_PER_MINUTE:-}"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    environment:
      CREDIT_API_KEY: "${CREDIT_API_KEY:-}"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs

